<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת השקעות - יוסטון, טקסס</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S1E7F8WCWF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-S1E7F8WCWF');
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; direction: ltr; }

        /* Map */
        #map { flex: 1; height: 100%; }

        /* Custom popup */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .leaflet-popup-content {
            margin: 0;
            min-width: 280px;
        }
        .popup-header {
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            color: #fff;
            padding: 14px 16px;
            border-radius: 12px 12px 0 0;
        }
        .popup-header h3 { font-size: 16px; margin-bottom: 2px; }
        .popup-header .sub { font-size: 12px; color: #aaa; }
        .popup-body { padding: 12px 16px 14px; }
        .popup-body p { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 8px; direction: rtl; text-align: right; }
        .popup-body .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .popup-body .info-row .label { color: #999; direction: rtl; }
        .popup-body .info-row .value { color: #333; font-weight: 600; direction: rtl; text-align: left; }
        .popup-body .popup-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .popup-body .lennar-link {
            display: inline-block;
            font-size: 12px;
            color: #0f3460;
            text-decoration: none;
            font-weight: 600;
        }
        .popup-body .lennar-link:hover { text-decoration: underline; }
        .popup-body .aerial-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 5px 12px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .popup-body .aerial-btn:hover { opacity: 0.85; transform: scale(1.02); }

        /* Aerial modal */
        .aerial-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .aerial-modal-overlay.active { display: flex; }
        .aerial-modal {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            width: 700px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .aerial-modal-header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            color: #fff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .aerial-modal-header h3 { font-size: 16px; }
        .aerial-modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 0 4px;
            opacity: 0.7;
        }
        .aerial-modal-close:hover { opacity: 1; }
        #aerial-map {
            width: 100%;
            height: 420px;
        }
        .aerial-modal-footer {
            padding: 10px 20px;
            font-size: 12px;
            color: #888;
            text-align: center;
            background: #f8f8f8;
            direction: rtl;
        }

        /* Drive time label on map */
        .drive-label {
            background: rgba(26, 26, 46, 0.85);
            color: #eee;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Community name labels */
        .community-label {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(0,0,0,1), 0 0 16px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* Employer name labels */
        .employer-label {
            background: rgba(230, 126, 34, 0.92);
            border: none;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            white-space: normal;
            text-align: center;
            padding: 3px 6px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            line-height: 1.2;
            pointer-events: none;
        }

        /* Ring labels */
        .ring-label {
            background: none;
            border: none;
            color: rgba(15, 52, 96, 0.45);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Layer control */
        .map-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }
        .basemap-btns { display: flex; gap: 6px; }
        .map-btn {
            padding: 8px 14px;
            background: rgba(26, 26, 46, 0.85);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .map-btn:hover { background: rgba(40, 40, 70, 0.9); color: #fff; }
        .map-btn.active { background: #e94560; color: #fff; border-color: #e94560; }

        /* Layers panel - what is shown on the map */
        #layersToggleBtn { display: none; }
        .layers-panel {
            background: rgba(26, 26, 46, 0.92);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            direction: rtl;
            color: #ddd;
            font-size: 13px;
            min-width: 186px;
        }
        .layers-panel .lp-title {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .layers-panel label {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 4px 0;
            cursor: pointer;
            user-select: none;
        }
        .layers-panel label:hover { color: #fff; }
        .layers-panel input { accent-color: #e94560; width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }
        .layers-panel .lp-hint {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.12);
        }

        /* Status badge for under-construction / future sites */
        .status-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 8px;
            background: #f39c12;
            color: #fff;
            vertical-align: middle;
            margin-right: 4px;
        }

        /* "Jobs nearby" block inside community popup */
        .popup-jobs {
            margin-top: 10px;
            background: #f4f7fb;
            border-radius: 8px;
            padding: 8px 10px;
            direction: rtl;
        }
        .popup-jobs .pj-title {
            font-size: 12px;
            font-weight: 700;
            color: #0f3460;
            margin-bottom: 4px;
        }
        .popup-jobs .pj-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 12px;
            padding: 3px 0;
            border-bottom: 1px solid #e6ebf2;
            color: #444;
        }
        .popup-jobs .pj-row:last-child { border-bottom: none; }
        .popup-jobs .pj-row .pj-name { font-weight: 600; flex: 1; }
        .popup-jobs .pj-row .pj-jobs { color: #666; white-space: nowrap; }
        .popup-jobs .pj-row .pj-min { color: #999; white-space: nowrap; font-size: 11px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* First-visit hint */
        #welcomeHint {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(26, 26, 46, 0.94);
            color: #fff;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            direction: rtl;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100vw - 40px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        #welcomeHint.show { opacity: 1; pointer-events: auto; }
        #welcomeHint button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
            padding: 0 2px;
        }
        #welcomeHint button:hover { color: #fff; }
        @media (max-width: 768px) {
            #welcomeHint { font-size: 11px; bottom: 76px; padding: 8px 14px; }
        }

        /* Resources Panel */
        #resources-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 1100;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(233,69,96,0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #resources-btn:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(233,69,96,0.5); }
        #resources-btn .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #f39c12;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #resources-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1200;
        }
        #resources-overlay.active { display: block; }

        #resources-panel {
            position: fixed;
            top: 0;
            left: -420px;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: #1a1a2e;
            z-index: 1300;
            overflow-y: auto;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            direction: rtl;
        }
        #resources-panel.open { left: 0; }

        .res-header {
            padding: 24px 20px 16px;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .res-header h2 { font-size: 18px; color: #fff; }
        .res-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0 4px;
        }
        .res-close:hover { color: #fff; }

        .res-card {
            margin: 12px 16px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .res-card:hover {
            background: rgba(233,69,96,0.1);
            border-color: rgba(233,69,96,0.3);
            transform: translateY(-2px);
        }
        .res-card-body {
            padding: 16px;
        }
        .res-card-source {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #e94560;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .res-card-source .src-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .res-card-source .src-icon.facebook { background: #1877f2; color: #fff; }
        .res-card-source .src-icon.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: #fff; }
        .res-card-source .src-icon.article { background: #2ecc71; color: #fff; }
        .res-card-source .src-icon.youtube { background: #ff0000; color: #fff; }

        .res-card h3 {
            font-size: 14px;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .res-card .res-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
        .res-card .res-date {
            font-size: 10px;
            color: #666;
            margin-top: 8px;
        }
        .res-card .res-arrow {
            float: left;
            color: #e94560;
            font-size: 18px;
            margin-top: -20px;
        }
        .res-card video {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
            max-height: 500px;
            background: #000;
        }
        .res-card .res-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #1877f2;
            text-decoration: none;
            margin-top: 6px;
        }
        .res-card .res-link:hover { text-decoration: underline; }

        .res-empty-hint {
            padding: 40px 20px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }

        /* Search bar */
        .search-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            overflow: hidden;
            width: 360px;
            max-width: calc(100vw - 200px);
            transition: box-shadow 0.2s;
        }
        .search-container:focus-within {
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
        }
        .search-container input {
            border: none;
            outline: none;
            padding: 10px 14px;
            font-size: 14px;
            flex: 1;
            min-width: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: ltr;
        }
        .search-container input::placeholder { color: #aaa; }
        .search-container .search-btn {
            background: none;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 18px;
            color: #555;
            display: flex;
            align-items: center;
        }
        .search-container .search-btn:hover { color: #0f3460; }
        .search-container .search-clear {
            background: none;
            border: none;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 16px;
            color: #999;
            display: none;
        }
        .search-container .search-clear.visible { display: block; }
        .search-results {
            position: absolute;
            top: 46px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 998;
            width: 360px;
            max-width: calc(100vw - 200px);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        .search-results.active { display: block; }
        .search-result-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: #f5f5f5; }
        .search-result-item .result-icon { font-size: 16px; flex-shrink: 0; }
        .search-result-item .result-text { flex: 1; min-width: 0; }
        .search-result-item .result-name { font-weight: 600; }
        .search-result-item .result-detail { font-size: 11px; color: #888; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-item .sv-mini {
            font-size: 11px;
            background: #f39c12;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            font-weight: 600;
        }

        /* Street view button on map */
        .sv-map-btn {
            position: absolute;
            bottom: 30px;
            right: 12px;
            z-index: 999;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sv-map-btn:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .sv-map-btn.active { background: #f39c12; color: #fff; }

        .sv-tooltip {
            position: absolute;
            bottom: 80px;
            right: 8px;
            z-index: 999;
            background: rgba(26,26,46,0.9);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            display: none;
            direction: rtl;
        }
        .sv-tooltip.active { display: block; }

        /* Mobile responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #map { height: 100vh; }

            /* Map labels - smaller for mobile */
            .community-label { font-size: 14px; }
            .employer-label { font-size: 9px; padding: 2px 6px; }

            /* Map controls */
            .map-btn { padding: 5px 10px; font-size: 11px; }
            .map-controls { top: 8px; right: 8px; gap: 4px; }

            /* Layers panel collapses behind a button on mobile */
            #layersToggleBtn { display: inline-block; }
            .layers-panel { display: none; }
            .layers-panel.open { display: block; }

            /* Aerial modal */
            .aerial-modal { width: 95vw; }
            .aerial-modal-header h3 { font-size: 13px; }
            #aerial-map { height: 280px; }
            .aerial-modal-footer { font-size: 11px; padding: 8px 12px; }

            /* Resources panel mobile */
            #resources-panel { width: 100vw; max-width: 100vw; left: -105vw; }
            #resources-btn { bottom: 16px; left: 16px; width: 46px; height: 46px; font-size: 20px; }

            /* Search bar mobile */
            .search-container { width: 240px; max-width: calc(100vw - 160px); }
            .search-container input { padding: 8px 10px; font-size: 12px; }
            .search-results { width: 280px; max-width: calc(100vw - 40px); }
            .sv-map-btn { width: 38px; height: 38px; font-size: 18px; bottom: 24px; }
        }
    </style>
</head>
<body>
    <div id="map" style="position: relative; width: 100%; height: 100vh;">
        <div class="map-controls">
            <div class="basemap-btns">
                <button class="map-btn active" id="btnStreet" onclick="setLayer('street')">מפה</button>
                <button class="map-btn" id="btnSatellite" onclick="setLayer('satellite')">לוויין</button>
                <button class="map-btn" id="layersToggleBtn" onclick="toggleLayersPanel()">🗂️ שכבות</button>
            </div>
            <div class="layers-panel" id="layersPanel">
                <div class="lp-title">מה מוצג במפה</div>
                <label><input type="checkbox" id="lyr-communities" checked onchange="applyLayers()"> 🏘️ קהילות להשקעה</label>
                <label><input type="checkbox" id="lyr-employers" checked onchange="applyLayers()"> 💼 מרכזי תעסוקה</label>
                <label><input type="checkbox" id="lyr-future" checked onchange="applyLayers()"> 🏗️ פרויקטים עתידיים</label>
                <label><input type="checkbox" id="lyr-drive" onchange="applyLayers()"> 🚗 מרחק ממרכז יוסטון</label>
                <div class="lp-hint">💡 מתקרבים במפה - נחשפים מעסיקים ופרויקטים נוספים</div>
            </div>
        </div>

        <!-- First-visit hint -->
        <div id="welcomeHint">
            <span>🖱️ כל נקודה במפה נפתחת בלחיצה - קהילות להשקעה, מעסיקים גדולים ופרויקטים עתידיים</span>
            <button onclick="dismissWelcome()" title="סגור">&times;</button>
        </div>

        <!-- Search bar -->
        <div class="search-container">
            <button class="search-btn" onclick="doSearch()" title="Search">🔍</button>
            <input type="text" id="searchInput" placeholder="Search address or street..." autocomplete="off"
                   onkeydown="if(event.key==='Enter')doSearch()" oninput="onSearchInput()">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">&times;</button>
        </div>
        <div class="search-results" id="searchResults"></div>

        <!-- Street View button -->
        <button class="sv-map-btn" id="svBtn" onclick="toggleStreetViewMode()" title="Street View">🚶</button>
        <div class="sv-tooltip" id="svTooltip">לחץ על המפה לפתיחת Street View</div>
    </div>

    <!-- Resources Button & Panel -->
    <button id="resources-btn" onclick="toggleResources()" title="תוכן ומידע למשקיעים">
        📰
        <span class="badge-count" id="res-count"></span>

            type: 'תעשייה ביטחונית'

    // ========== FUTURE DEVELOPMENTS ==========
    const futureDevelopments = [
        {
            name: 'Toro District',
            nameHe: 'מתחם טורו - מטה Houston Texans',
            icon: '🏈',
            lat: 29.936,

            highlights: ['מתחם אימונים מקורה 150,000 sqft', '175,000 sqft משרדים', '61 אקר מסחרי', '6 פארקים + 5,000 חניות']
        },
        {
            name: 'Convention District',
            nameHe: 'מתחם הכנסים - הרחבת GRB',
            icon: '🏗️',
            lat: 29.7519,
            lng: -95.3575,
            status: 'בבנייה · שלב 1 נפתח 2028',
            cost: '$2B · $20B השפעה ב-30 שנה',
            desc: 'הרחבת מרכז הכנסים George R. Brown ב-700,000 sqft. אולם האירועים הגדול בטקסס, פלאזה 100,000 sqft, קמעונאות ומסעדות. 60 בלוקים של פיתוח מעורב - מגורים, מלונות, בילוי. קו רכבת קלה עתידי. יוסטון אירחה 7 משחקי מונדיאל ביוני-יולי 2026.',
            highlights: ['700,000 sqft הרחבה', 'האולם הגדול בטקסס', 'אירחה מונדיאל 2026 · RNC 2028', 'קו מטרו חדש מזרח-מערב']
        }
    ];

    // ========== MAP SETUP ==========
    const map = L.map('map', {
        center: [29.95, -95.35],
        zoom: 10,
        zoomControl: false
    });

    // Auto-fit to show all communities
    const communityBounds = L.latLngBounds(communities.map(c => [c.lat, c.lng]));
    communityBounds.extend(HOUSTON_CENTER);
    map.fitBounds(communityBounds, { padding: [30, 30] });

    L.control.zoom({ position: 'topleft' }).addTo(map);

    const streetLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri',
        maxZoom: 19
    });

    const labelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    });

    streetLayer.addTo(map);
    let currentLayer = 'street';

    function setLayer(type) {
        gtag('event', 'map_layer_switch', { layer_type: type });
        document.getElementById('btnStreet').classList.remove('active');
        document.getElementById('btnSatellite').classList.remove('active');
        if (type === 'satellite') {
            map.removeLayer(streetLayer);
            map.removeLayer(labelsLayer);
            satelliteLayer.addTo(map);
            labelsLayer.addTo(map);
            document.getElementById('btnSatellite').classList.add('active');
        } else {
            map.removeLayer(satelliteLayer);
            map.removeLayer(labelsLayer);
            streetLayer.addTo(map);
            document.getElementById('btnStreet').classList.add('active');
        }
        currentLayer = type;
    }

    // ========== LAYER GROUPS (controlled by the layers panel) ==========
    const communitiesLayer = L.layerGroup();
    const employersT1 = L.layerGroup();   // metro flagships - always shown when employers layer is on
    const employersT2 = L.layerGroup();   // local anchors - shown at zoom >= 10
    const futureLayer = L.layerGroup();
    const driveLayer = L.layerGroup();    // distance rings + drive-time lines (off by default)
    const T2_MIN_ZOOM = 10;

    // ========== HOUSTON DISTANCE RINGS (into driveLayer) ==========
    const ringDistances = [
        { radius: 16000, label: '~15 דקות' },
        { radius: 32000, label: '~30 דקות' },
        { radius: 48000, label: '~45 דקות' }
    ];

    // Downtown Houston highlight
    L.circle(HOUSTON_CENTER, {
        radius: 5000,
        color: '#e94560',
        fillColor: '#e94560',
        fillOpacity: 0.08,
        weight: 2,
        opacity: 0.5
    }).addTo(driveLayer);

    ringDistances.forEach(ring => {
        L.circle(HOUSTON_CENTER, {
            radius: ring.radius,
            color: 'rgba(15, 52, 96, 0.25)',
            fillColor: 'transparent',
            fillOpacity: 0,
            weight: 1.5,
            dashArray: '8, 8'
        }).addTo(driveLayer);

        // Label at the top of each ring
        const labelLat = HOUSTON_CENTER[0] + (ring.radius / 111320);
        L.marker([labelLat, HOUSTON_CENTER[1]], {
            icon: L.divIcon({
                className: 'ring-label',
                html: ring.label,
                iconSize: [60, 16],
                iconAnchor: [30, 8]
            }),
            interactive: false
        }).addTo(driveLayer);
    });

    // ========== DRIVING TIME LINES (into driveLayer; each community can also show its own line temporarily) ==========
    function buildDriveLine(c) {
        const line = L.polyline(
            [HOUSTON_CENTER, [c.lat, c.lng]],
            {
                color: c.color,
                weight: 2.5,
                opacity: 0.6,
                dashArray: '8, 6'
            }
        );
        const midLat = (HOUSTON_CENTER[0] + c.lat) / 2;
        const midLng = (HOUSTON_CENTER[1] + c.lng) / 2;
        const label = L.marker([midLat, midLng], {
            icon: L.divIcon({
                className: 'drive-label',
                html: `🚗 ${c.driveTime} למרכז יוסטון`,
                iconSize: [150, 22],
                iconAnchor: [75, 11]
            }),
            interactive: false
        });
        return L.layerGroup([line, label]);
    }

    communities.forEach(c => {
        buildDriveLine(c).addTo(driveLayer);
    });

    // ========== COMMUNITY MARKERS ==========
    function createCommunityIcon(color) {
        return L.divIcon({
            className: 'custom-marker',
            html: `<div style="
                width: 28px; height: 28px;
                background: ${color};
                border: 3px solid #fff;
                border-radius: 50%;
                box-shadow: 0 2px 8px rgba(0,0,0,0.4);
                display: flex; align-items: center; justify-content: center;
            "><div style="width:8px;height:8px;background:#fff;border-radius:50%;"></div></div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -16]
        });
    }

    const communityMarkers = {};

    communities.forEach(c => {
        const jobsHtml = (c.jobAnchors && c.jobAnchors.length)
            ? `<div class="popup-jobs">
                    <div class="pj-title">💼 מקומות עבודה קרובים</div>
                    ${c.jobAnchors.map(a => `<div class="pj-row"><span class="pj-name">${a.name}</span><span class="pj-jobs">${a.jobs}</span><span class="pj-min">🚗 ${a.min}</span></div>`).join('')}
               </div>`
            : '';

        const marker = L.marker([c.lat, c.lng], { icon: createCommunityIcon(c.color) })
            .addTo(communitiesLayer)
            .bindPopup(`
                <div class="popup-header">
                    <h3>${c.name} (${c.nameHe})</h3>
                    <div class="sub">${c.area} · ${c.builder} · 🚗 ${c.driveTime} למרכז</div>
                </div>
                <div class="popup-body">
                    <p>${c.description}</p>
                    <div class="info-row"><span class="label">שכונות</span><span class="value">${c.communities}</span></div>
                    <div class="info-row"><span class="label">טווח מחירים</span><span class="value">${c.priceRange}</span></div>
                    <div class="info-row"><span class="label">מחוז בתי ספר</span><span class="value">${c.schoolDistrict}</span></div>
                    <div class="info-row"><span class="label">נקודות עניין</span><span class="value">${c.highlights.join(', ')}</span></div>
                    ${jobsHtml}
                    <div class="popup-links">
                        <a class="lennar-link" href="${c.url}" target="_blank">צפה ב-Lennar.com ←</a>
                        <button class="aerial-btn" onclick="openAerial('${c.id}')">📸 צילום אווירי</button>
                    </div>
                </div>
            `, { maxWidth: 340 });

        communityMarkers[c.id] = marker;

        marker.on('click', () => {
            gtag('event', 'community_click', { community_name: c.name, community_id: c.id, area: c.area });
        });

        // While a community popup is open, show its drive-to-downtown line
        // (even when the distance layer is switched off)
        let tempLine = null;
        marker.on('popupopen', () => {
            if (!document.getElementById('lyr-drive').checked) {
                tempLine = buildDriveLine(c).addTo(map);
            }
        });
        marker.on('popupclose', () => {
            if (tempLine) { map.removeLayer(tempLine); tempLine = null; }
        });

        // Community name label - anchored in pixels so it hugs the marker at every zoom level
        L.marker([c.lat, c.lng], {
            icon: L.divIcon({
                className: 'community-label',
                html: c.name,
                iconSize: [200, 30],
                iconAnchor: [100, 50]
            }),
            interactive: false
        }).addTo(communitiesLayer);

        // Subtle circle around community
        L.circle([c.lat, c.lng], {
            radius: 3000,
            color: c.color,
            fillColor: c.color,
            fillOpacity: 0.08,
            weight: 1.5,
            opacity: 0.4
        }).addTo(communitiesLayer);
    });

    // ========== AERIAL PHOTO MODAL ==========
    let aerialMap = null;

    function openAerial(communityId) {
        const c = communities.find(x => x.id === communityId);
        if (!c) return;
        gtag('event', 'aerial_view', { community_name: c.name, community_id: communityId });

        document.getElementById('aerialTitle').textContent = `📸 ${c.name} (${c.nameHe}) - תצוגת לוויין`;
        document.getElementById('aerialFooter').textContent = c.aerialNote;
        document.getElementById('aerialOverlay').classList.add('active');

        // Destroy old map if exists
        if (aerialMap) {
            aerialMap.remove();
            aerialMap = null;
        }

        // Use aerial-specific coordinates if available, otherwise fall back to main coords
        const aLat = c.aerialLat || c.lat;
        const aLng = c.aerialLng || c.lng;

        // Create mini satellite map
        setTimeout(() => {
            aerialMap = L.map('aerial-map', {
                center: [aLat, aLng],
                zoom: c.aerialZoom,
                zoomControl: true
            });

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: '&copy; Esri',
                maxZoom: 19
            }).addTo(aerialMap);

            // Add labels overlay
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(aerialMap);

            // Add marker at the aerial coordinates
            L.marker([aLat, aLng], { icon: createCommunityIcon(c.color) }).addTo(aerialMap);

            // Add smaller radius for zoomed-in view
            L.circle([aLat, aLng], {
                radius: 500,
                color: c.color,
                fillColor: c.color,
                fillOpacity: 0.1,
                weight: 2,
                dashArray: '6, 4'
            }).addTo(aerialMap);
        }, 100);
    }

    function closeAerial() {
        document.getElementById('aerialOverlay').classList.remove('active');
        if (aerialMap) {
            aerialMap.remove();
            aerialMap = null;
        }
    }

    // Close modal on overlay click
    document.getElementById('aerialOverlay').addEventListener('click', function(e) {
        if (e.target === this) closeAerial();
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAerial();
    });

    // ========== EMPLOYER MARKERS ==========
    function createEmployerIcon(emp) {
        const size = emp.tier === 1 ? 40 : 32;
        const inner = emp.logo
            ? `<img src="${emp.logo}" style="width:${size - 14}px;height:${size - 14}px;object-fit:contain;border-radius:4px;pointer-events:none;" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none;font-size:${size - 20}px;pointer-events:none">${emp.icon}</span>`
            : `<span style="font-size:${size - 20}px;pointer-events:none">${emp.icon}</span>`;
        return L.divIcon({
            className: 'employer-marker',
            html: `<div style="
                width: ${size}px; height: ${size}px;
                background: #fff;
                border: 2px ${emp.status ? 'dashed' : 'solid'} #e67e22;
                border-radius: 8px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.35);
                display: flex; align-items: center; justify-content: center;
            ">${inner}</div>`,
            iconSize: [size, size],
            iconAnchor: [size / 2, size / 2],
            popupAnchor: [0, -(size / 2 + 4)]
        });
    }

    // Label groups: compact name-only labels far out, full name+jobs labels close up
    const empLabelsLow = L.layerGroup();   // tier-1 compact labels, zoom < T2_MIN_ZOOM
    const empLabelsHi = L.layerGroup();    // tier-1 full labels, zoom >= T2_MIN_ZOOM

    // Pixel-anchored label that hugs its marker at every zoom; side 'above' | 'below'
    function makeEmployerLabel(emp, markerSize, full) {
        const w = 110, h = full ? 38 : 20, gap = 4;
        const side = emp.labelSide === 'below' ? 'below' : 'above';
        const anchorY = side === 'above' ? (h + markerSize / 2 + gap) : -(markerSize / 2 + gap);
        const html = full
            ? `${emp.name}<br><span style="font-size:9px;font-weight:400;opacity:0.85">${emp.status ? '🚧 ' : ''}${emp.jobsLabel}</span>`
            : `<span style="font-size:10px">${emp.status ? '🚧 ' : ''}${emp.name}</span>`;
        return L.marker([emp.lat, emp.lng], {
            icon: L.divIcon({
                className: 'employer-label',
                html: html,
                iconSize: [w, h],
                iconAnchor: [w / 2, anchorY]
            }),
            interactive: false
        });
    }

    employers.forEach(emp => {
        const group = emp.tier === 1 ? employersT1 : employersT2;
        const size = emp.tier === 1 ? 40 : 32;
        const statusBadge = emp.status ? `<span class="status-badge">🚧 ${emp.status}</span>` : '';

        L.marker([emp.lat, emp.lng], { icon: createEmployerIcon(emp) })
            .addTo(group)
            .bindPopup(`
                <div class="popup-header" style="background:linear-gradient(135deg, #e67e22, #d35400);">
                    <h3>${emp.logo ? `<img src="${emp.logo}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-left:4px;border-radius:3px">` : emp.icon} ${emp.name} ${statusBadge}</h3>
                    <div class="sub">${emp.nameHe} · ${emp.type}</div>
                </div>
                <div class="popup-body">
                    <div class="info-row"><span class="label">היקף תעסוקה</span><span class="value">${emp.jobsLabel}</span></div>
                    <p style="margin-top:8px">${emp.desc}</p>
                </div>
            `, { maxWidth: 300 })
            .on('click', () => {
                gtag('event', 'employer_click', { employer_name: emp.name, employer_type: emp.type });
            });

        // Districts (Energy Corridor, Ship Channel) get a soft area circle - they are zones, not a single site
        if (emp.area) {
            L.circle([emp.lat, emp.lng], {
                radius: emp.area,
                color: '#e67e22',
                fillColor: '#e67e22',
                fillOpacity: 0.06,
                weight: 1.5,
                dashArray: '6, 6',
                opacity: 0.5,
                interactive: false
            }).addTo(group);
        }

        if (emp.tier === 1) {
            makeEmployerLabel(emp, size, false).addTo(empLabelsLow);
            makeEmployerLabel(emp, size, true).addTo(empLabelsHi);
        } else {
            makeEmployerLabel(emp, size, true).addTo(group);
        }
    });

    // ========== MAP - FUTURE DEVELOPMENTS ==========
    // markers of stand-alone projects always show (when the layer is on);
    // labels + downtown projects (which overlap the Downtown pin) appear from zoom >= 10
    const futureDetail = L.layerGroup();
    futureDevelopments.forEach(fd => {
        const fdIcon = L.divIcon({
            className: 'employer-icon',
            html: `<div style="font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));animation:pulse 2s infinite">${fd.icon}</div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });
        const markerGroup = (fd.name === 'Convention District') ? futureDetail : futureLayer;
        L.marker([fd.lat, fd.lng], { icon: fdIcon })
            .addTo(markerGroup)
            .bindPopup(`
                <div class="popup-header" style="background:linear-gradient(135deg, #8e44ad, #6c3483);">
                    <h3>${fd.icon} ${fd.name} <span class="status-badge" style="background:#8e44ad">עתידי</span></h3>
                    <div class="sub">${fd.nameHe}</div>
                </div>
                <div class="popup-body">
                    <div style="margin-bottom:8px"><strong>${fd.status}</strong> · ${fd.cost}</div>
                    <p>${fd.desc}</p>
                    <div style="margin-top:8px">${fd.highlights.map(h => `<span style="display:inline-block;background:#8e44ad22;color:#8e44ad;padding:2px 8px;border-radius:10px;font-size:11px;margin:2px">${h}</span>`).join('')}</div>
                </div>
            `, { maxWidth: 350 });

        // Label below the marker (pixel-anchored, click-through) - only from zoom >= 10
        L.marker([fd.lat, fd.lng], {
            icon: L.divIcon({
                className: 'employer-label',
                html: `<div style="white-space:nowrap;font-size:12px;font-weight:700;color:#8e44ad;text-shadow:1px 1px 3px #fff,-1px -1px 3px #fff,1px -1px 3px #fff,-1px 1px 3px #fff;pointer-events:none">${fd.name}<br><span style="font-size:10px;font-weight:400;opacity:0.85">${fd.status.split('·')[0].trim()}</span></div>`,
                iconSize: [120, 30],
                iconAnchor: [60, -14]
            }),
            interactive: false
        }).addTo(futureDetail);
    });

    // ========== LAYERS PANEL LOGIC ==========
    function setGroup(group, show) {
        if (show) { if (!map.hasLayer(group)) group.addTo(map); }
        else { if (map.hasLayer(group)) map.removeLayer(group); }
    }

    function applyLayers(fromUser) {
        const on = id => document.getElementById(id).checked;
        const zoomedIn = map.getZoom() >= T2_MIN_ZOOM;
        setGroup(communitiesLayer, on('lyr-communities'));
        setGroup(futureLayer, on('lyr-future'));
        setGroup(futureDetail, on('lyr-future') && zoomedIn);
        setGroup(driveLayer, on('lyr-drive'));
        const emp = on('lyr-employers');
        setGroup(employersT1, emp);
        setGroup(employersT2, emp && zoomedIn);
        setGroup(empLabelsLow, emp && !zoomedIn);
        setGroup(empLabelsHi, emp && zoomedIn);
        if (fromUser !== false) {
            gtag('event', 'layers_change', {
                communities: on('lyr-communities'), employers: emp,
                future: on('lyr-future'), drive: on('lyr-drive'), zoom: map.getZoom()
            });
        }
    }

    map.on('zoomend', () => applyLayers(false));
    applyLayers(false);

    function toggleLayersPanel() {
        document.getElementById('layersPanel').classList.toggle('open');
    }

    // ========== FIRST-VISIT HINT ==========
    function dismissWelcome() {
        document.getElementById('welcomeHint').classList.remove('show');
        try { localStorage.setItem('hm_welcome_seen', '1'); } catch (e) {}
    }
    (function () {
        let seen = false;
        try { seen = localStorage.getItem('hm_welcome_seen') === '1'; } catch (e) {}
        if (!seen) {
            setTimeout(() => document.getElementById('welcomeHint').classList.add('show'), 800);
            setTimeout(dismissWelcome, 12000);
            map.once('popupopen', dismissWelcome);
        }
    })();

    // ========== RESOURCES / CONTENT FOR INVESTORS ==========
    const resources = [
        {
            title: 'How Geography Made The US Unstoppable.',
            desc: '',
            source: 'facebook',
            url: 'https://www.facebook.com/reel/2300816357112757',
            video: 'videos/video1.mp4',
            date: '2026-03-22'
        },
        {
            title: 'How Texas Is Becoming America\'s Most Powerful State.',
            desc: '',
            source: 'facebook',
            url: 'https://www.facebook.com/reel/2207217716683715',
            video: 'videos/video2.mp4',
            date: '2026-03-22'
        },
        {
            title: 'הצמיחה של יוסטון - חברות גדולות ושוק הדיור',
            desc: '',
            source: 'facebook',
            url: '',
            video: 'videos/video3.mp4',
            date: '2026-03-22'
        }
    ];

    const sourceConfig = {
        facebook:  { icon: 'f', label: 'Facebook', cls: 'facebook' },
        instagram: { icon: '📷', label: 'Instagram', cls: 'instagram' },
        youtube:   { icon: '▶', label: 'YouTube', cls: 'youtube' },
        article:   { icon: '📄', label: 'כתבה', cls: 'article' }
    };

    function renderResources() {
        const list = document.getElementById('resources-list');
        document.getElementById('res-count').textContent = resources.length;

        if (resources.length === 0) {
            list.innerHTML = '<div class="res-empty-hint">עדיין אין תוכן. יתווסף בקרוב!</div>';
            return;
        }

        list.innerHTML = resources.map(r => {
            const src = sourceConfig[r.source] || sourceConfig.article;
            const videoHtml = r.video
                ? `<video controls preload="metadata" playsinline><source src="${r.video}" type="video/mp4"></video>`
                : '';
            const linkHtml = r.url
                ? `<a class="res-link" href="${r.url}" target="_blank">🔗 צפה במקור</a>`
                : '';
            const descHtml = r.desc ? `<div class="res-desc">${r.desc}</div>` : '';
            return `
                <div class="res-card">
                    <div class="res-card-body">
                        <div class="res-card-source">
                            <span class="src-icon ${src.cls}">${src.icon}</span>
                            ${src.label}
                        </div>
                        <h3>${r.title}</h3>
                        ${videoHtml}
                        ${descHtml}
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div class="res-date">📅 ${r.date}</div>
                            ${linkHtml}
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    function toggleResources() {
        const panel = document.getElementById('resources-panel');
        const overlay = document.getElementById('resources-overlay');
        const isOpen = panel.classList.contains('open');
        if (!isOpen) gtag('event', 'resources_open');
        if (isOpen) {
            panel.classList.remove('open');
            overlay.classList.remove('active');
        } else {
            panel.classList.add('open');
            overlay.classList.add('active');
        }
    }

    renderResources();

    // ========== SEARCH ==========
    let searchMarker = null;
    let searchTimeout = null;

    function onSearchInput() {
        const val = document.getElementById('searchInput').value;
        document.getElementById('searchClear').classList.toggle('visible', val.length > 0);
        // Live search after 400ms pause
        clearTimeout(searchTimeout);
        if (val.length >= 3) {
            searchTimeout = setTimeout(() => doSearch(), 400);
        } else {
            document.getElementById('searchResults').classList.remove('active');
        }
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchClear').classList.remove('visible');
        document.getElementById('searchResults').classList.remove('active');
        if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
    }

    async function doSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        gtag('event', 'map_search', { search_term: query });

        const resultsEl = document.getElementById('searchResults');
        resultsEl.innerHTML = '<div style="padding:12px;text-align:center;color:#888;font-size:13px;">🔍 Searching...</div>';
        resultsEl.classList.add('active');

        try {
            // Search near Houston area
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Houston, TX')}&limit=6&addressdetails=1&viewbox=-96.1,30.4,-94.6,29.2&bounded=0`;
            const resp = await fetch(url, { headers: { 'Accept-Language': 'en' } });
            const data = await resp.json();

            if (data.length === 0) {
                resultsEl.innerHTML = '<div style="padding:16px;text-align:center;color:#888;font-size:13px;">No results found</div>';
                return;
            }

            resultsEl.innerHTML = data.map((item, i) => {
                const name = item.display_name.split(',').slice(0, 3).join(', ');
                const type = item.type || '';
                return `<div class="search-result-item" onclick="goToResult(${item.lat}, ${item.lon}, '${item.display_name.replace(/'/g, "\\'")}')">
                    <span class="result-icon">📍</span>
                    <div class="result-text">
                        <div class="result-name">${name}</div>
                        <div class="result-detail">${type}</div>
                    </div>
                    <span class="sv-mini" onclick="event.stopPropagation();openSV(${item.lat},${item.lon})">SV</span>
                </div>`;
            }).join('');
        } catch (err) {
            resultsEl.innerHTML = '<div style="padding:16px;text-align:center;color:#c0392b;font-size:13px;">Search error. Try again.</div>';
        }
    }

    function goToResult(lat, lng, name) {
        document.getElementById('searchResults').classList.remove('active');

        if (searchMarker) map.removeLayer(searchMarker);

        map.flyTo([lat, lng], 16, { duration: 1 });

        searchMarker = L.marker([lat, lng], {
            icon: L.divIcon({
                className: '',
                html: `<div style="
                    width:32px;height:32px;background:#e94560;border:3px solid #fff;
                    border-radius:50%;box-shadow:0 3px 12px rgba(0,0,0,0.4);
                    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;
                ">📍</div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -18]
            })
        }).addTo(map);

        const shortName = name.split(',').slice(0, 2).join(', ');
        searchMarker.bindPopup(`
            <div class="popup-header" style="background:linear-gradient(135deg,#e94560,#c0392b);">
                <h3>📍 ${shortName}</h3>
            </div>
            <div class="popup-body" style="text-align:center;padding:12px;">
                <button onclick="openSV(${lat},${lng})" style="
                    background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;
                    border:none;padding:8px 18px;border-radius:8px;cursor:pointer;
                    font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
                ">🚶 Street View</button>
                <button onclick="openGoogleMaps(${lat},${lng})" style="
                    background:linear-gradient(135deg,#16213e,#0f3460);color:#fff;
                    border:none;padding:8px 18px;border-radius:8px;cursor:pointer;
                    font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
                    margin-top:6px;
                ">🗺️ Google Maps</button>
            </div>
        `, { maxWidth: 260 }).openPopup();
    }

    // ========== STREET VIEW ==========
    function openSV(lat, lng) {
        window.open(`https://www.google.com/maps/@${lat},${lng},3a,75y,0h,90t/data=!3m6!1e1!3m4!1s!2e0!7i16384!8i8192`, '_blank');
    }

    function openGoogleMaps(lat, lng) {
        window.open(`https://www.google.com/maps/@${lat},${lng},17z`, '_blank');
    }

    // Street View click mode
    let svMode = false;
    function toggleStreetViewMode() {
        svMode = !svMode;
        if (svMode) gtag('event', 'streetview_toggle');
        document.getElementById('svBtn').classList.toggle('active', svMode);
        document.getElementById('svTooltip').classList.toggle('active', svMode);
        document.getElementById('map').style.cursor = svMode ? 'crosshair' : '';

        if (svMode) {
            // Auto-hide tooltip after 3s
            setTimeout(() => {
                document.getElementById('svTooltip').classList.remove('active');
            }, 3000);
        }
    }

    map.on('click', function(e) {
        if (svMode) {
            openSV(e.latlng.lat, e.latlng.lng);
            // Don't exit mode - user might want to click multiple spots
        }
    });

    // Close search results when clicking elsewhere
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-container') && !e.target.closest('.search-results')) {
            document.getElementById('searchResults').classList.remove('active');
        }
    });

    </script>
</body>
</html>
